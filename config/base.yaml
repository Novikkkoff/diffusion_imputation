train:
  epochs: 1000
  batch_size: 1
  lr: 1.0e-3
  itr_per_epoch: 30

diffusion:
  layers: 4
  channels: 64
  nheads: 8
  diffusion_embedding_dim: 128
  beta_start: 0.0001
  beta_end: 0.03
  num_steps: 100
  schedule: "linear"
  is_linear: True           # O(n) LinearAttention — обязательно, иначе >80GB
  max_seq_len_time: 626     # floor(160000 / 256) + 1 при torch.stft(center=True)
  max_seq_len_freq: 257     # F = n_fft//2+1 = 512//2+1

model:
  is_unconditional: 0
  timeemb: 128              # ОБЯЗАТЕЛЬНО чётное
  featureemb: 16
  target_strategy: "random"
  train_missing_ratio: 0.0
# Параметры аудио (задаются в exe_audio.py):
#   sr=16000, n_fft=512, hop=256, win=512
#   COLA: hop=256 = win/2=256  ✓  (Hann окно, корректный ISTFT)
#   F = 512//2+1 = 257
#   T = 160000 сэмплов (10 сек)
#   N = floor(160000 / 256) + 1 = 626 кадров при center=True
#   Память: B=8, F=257, L=626, is_linear=True -> ~35 GB ✓
